name: Build browser image

# 带无头浏览器的镜像（:browser 标签），给需要 Cloudflare Turnstile 的站点做自动
# 签到用。浏览器是 cloakbrowser（指纹打过补丁的 Chromium）——普通 Chromium 会被
# Cloudflare 识破，cloakbrowser 实测能在幻城网安上铸出站点接受的 token。
#
# 每次推 main 都重建，保证 :browser 与 :latest 同步。装依赖 + 预下载浏览器那一层
# 只有 Dockerfile.browser 变了才重跑，其余提交只重跑最后的 COPY，很快。
on:
  push:
    branches: [ main ]
    paths:
      - 'wb_*.py'
      - 'dashboard.html'
      - 'Dockerfile.browser'
      - '.github/workflows/docker-build-browser.yml'
  workflow_dispatch:

permissions:
  contents: read
  packages: write

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up QEMU
        uses: docker/setup-qemu-action@v3

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push
        uses: docker/build-push-action@v6
        with:
          context: .
          file: Dockerfile.browser
          push: true
          platforms: linux/amd64,linux/arm64
          tags: ghcr.io/${{ github.repository }}:browser
          cache-from: type=gha,scope=browser
          cache-to: type=gha,mode=max,scope=browser
