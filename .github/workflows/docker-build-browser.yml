name: Build browser image (experimental)

# 带无头 Chromium 的镜像（:browser 标签），给需要 Cloudflare Turnstile 的站点
# 做自动签到用。**实验性**：实测幻城网安这类站点的 Turnstile 会拒绝自动化会话
# （challenge-platform 的 /pat 返回 401，拿不到 token），不保证能用。
#
# 只手动触发，不跟每次 push：这层要装 playwright + chromium，镜像约 1GB，
# 自动跑会把每次提交的 CI 从 1 分钟拉到十几分钟。需要时在 Actions 里手动跑。
on:
  workflow_dispatch:

permissions:
  contents: read
  packages: write

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up QEMU
        uses: docker/setup-qemu-action@v3

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push
        uses: docker/build-push-action@v6
        with:
          context: .
          file: Dockerfile.browser
          push: true
          platforms: linux/amd64,linux/arm64
          tags: ghcr.io/${{ github.repository }}:browser
          cache-from: type=gha,scope=browser
          cache-to: type=gha,mode=max,scope=browser
