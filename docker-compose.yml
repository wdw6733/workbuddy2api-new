# WorkBuddy2API-Hub Docker Compose
# 部署：docker compose up -d
# 更新：docker compose pull && docker compose up -d
services:
  wb-proxy:
    # 使用本 fork 镜像（含公益站功能：站点聚合、出站身份伪装、测活 Key 校验、故障转移等）。
    # 不要改回上游官方镜像 ghcr.io/ardeyouxipianyi/workbuddy2api-hub，否则公益站功能会丢失。
    image: ghcr.io/wdw6733/workbuddy2api-new:latest
    container_name: wb-proxy
    restart: unless-stopped
    # Defaults to root (0:0), i.e. the historical behaviour. To run as your own
    # host user instead, set PUID/PGID (e.g. PUID=$(id -u) PGID=$(id -g)
    # docker compose up -d) and make sure ./accounts and ./usage are writable
    # by that uid; see the README's Docker section.
    user: "${PUID:-0}:${PGID:-0}"
    ports:
      # 宿主机端口:容器端口（右侧必须与下面的 PORT 保持一致）
      - "8788:8788"
    environment:
      - HOST=0.0.0.0
      - PORT=8788
      # 留空则启动时自动生成高强度 API Key 写入 ./accounts/settings.json 并打印在启动日志中
      # - API_KEY=your_secret_key
      - TZ=Asia/Shanghai
    volumes:
      # 持久化数据目录：升级与重建容器时绝不丢失配置与用量
      - ./accounts:/app/accounts
      - ./usage:/app/usage

  # 可选：Watchtower 自动静默更新服务（取消注释即可开启）
  # 每天自动检查镜像更新，拉取新版本并优雅重启 wb-proxy
  # watchtower:
  #   image: containrrr/watchtower:latest
  #   container_name: wb-proxy-watchtower
  #   restart: unless-stopped
  #   volumes:
  #     - /var/run/docker.sock:/var/run/docker.sock
  #   command: --interval 86400 --cleanup wb-proxy
